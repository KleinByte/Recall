name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source, native runtimes, and package
        run: pnpm verify:ci
      - name: Upload Electron layout diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-layout-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
