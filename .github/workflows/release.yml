name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version (expected $expectedTag)."
          }
      - name: Verify Azure signing configuration
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
        run: |
          $requiredVariables = @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME"
          )
          $missingVariables = @(
            $requiredVariables | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )
          if ($missingVariables.Count -gt 0) {
            throw "Missing GitHub Actions secrets or variables: $($missingVariables -join ', ')"
          }
          if ($env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME -eq "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME") {
            throw "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME must be the certificate Common Name, not the variable name."
          }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and sign release
        run: pnpm release:signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      - name: Upload Electron layout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-layout-diagnostics-${{ github.ref_name }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish one verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDirectory = "release/$version"
          $installer = "$releaseDirectory/Recall-Windows-Setup.exe"
          $manifest = "$releaseDirectory/latest.yml"
          $blockmap = "$installer.blockmap"
          $requiredFiles = @($installer, $manifest, $blockmap)

          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingFiles.Count -gt 0) {
            throw "Release build is missing updater files: $($missingFiles -join ', ')"
          }

          gh release create $env:GITHUB_REF_NAME @requiredFiles `
            --verify-tag `
            --title $version `
            --notes ""

          $publishedAssets = @(
            (gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json).assets.name
          )
          $requiredNames = @($requiredFiles | ForEach-Object { Split-Path -Leaf $_ })
          $missingAssets = @(
            $requiredNames | Where-Object { $_ -notin $publishedAssets }
          )
          if ($missingAssets.Count -gt 0) {
            throw "GitHub release is missing updater assets: $($missingAssets -join ', ')"
          }

          $matchingReleases = @(
            (gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json) |
              Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          )
          if ($matchingReleases.Count -ne 1) {
            throw "Expected exactly one GitHub release for $env:GITHUB_REF_NAME, found $($matchingReleases.Count)."
          }
