name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version (expected $expectedTag)."
          }
      - name: Verify Azure signing configuration
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
        run: |
          $requiredVariables = @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME"
          )
          $missingVariables = @(
            $requiredVariables | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )
          if ($missingVariables.Count -gt 0) {
            throw "Missing GitHub Actions secrets or variables: $($missingVariables -join ', ')"
          }
          if ($env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME -eq "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME") {
            throw "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME must be the certificate Common Name, not the variable name."
          }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and sign release
        run: pnpm release:signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      - name: Download the previous signed installer for upgrade testing
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $currentVersion = [version]((Get-Content package.json | ConvertFrom-Json).version)
          $candidates = @()
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.isDraft -or $release.isPrerelease -or $release.tagName -notmatch '^v\d+\.\d+\.\d+$') {
              continue
            }
            $candidateVersion = [version]$release.tagName.Substring(1)
            if ($candidateVersion -lt $currentVersion) {
              $candidates += [pscustomobject]@{
                tag = $release.tagName
                version = $candidateVersion
              }
            }
          }
          $previous = $candidates | Sort-Object version -Descending | Select-Object -First 1
          if (-not $previous) {
            "path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No older release is available; the clean install/reinstall path will still be tested."
            exit 0
          }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP "recall-previous-release"
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          gh release download $previous.tag `
            --pattern "Recall-Windows-Setup.exe" `
            --dir $downloadDirectory `
            --clobber
          $installer = (Resolve-Path (Join-Path $downloadDirectory "Recall-Windows-Setup.exe")).Path
          "path=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Upgrade baseline: $($previous.tag)"
      - name: Test silent install, upgrade, uninstall, and reinstall
        shell: pwsh
        env:
          PREVIOUS_INSTALLER: ${{ steps.previous-release.outputs.path }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $currentInstaller = (Resolve-Path "release/$version/Recall-Windows-Setup.exe").Path
          $previousInstaller = $env:PREVIOUS_INSTALLER
          $arguments = @(
            "-NoProfile",
            "-NonInteractive",
            "-ExecutionPolicy", "Bypass",
            "-File", "scripts/test-store-installer.ps1",
            "-CurrentInstallerPath", $currentInstaller
          )
          if (-not [string]::IsNullOrWhiteSpace($previousInstaller)) {
            $arguments += @("-PreviousInstallerPath", $previousInstaller)
          }
          & powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Store installer lifecycle tests failed with exit code $LASTEXITCODE."
          }
      - name: Upload Store release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: store-release-diagnostics-${{ github.ref_name }}
          path: |
            release/**/Recall-Windows-Setup.defender.json
            release/**/Recall-Windows-Setup.store-inventory.json
            release/**/Recall-Windows-Setup.sha256
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Electron layout diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-layout-diagnostics-${{ github.ref_name }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish one verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDirectory = "release/$version"
          $installer = "$releaseDirectory/Recall-Windows-Setup.exe"
          $manifest = "$releaseDirectory/latest.yml"
          $blockmap = "$installer.blockmap"
          $defenderReport = "$releaseDirectory/Recall-Windows-Setup.defender.json"
          $inventory = "$releaseDirectory/Recall-Windows-Setup.store-inventory.json"
          $checksums = "$releaseDirectory/Recall-Windows-Setup.sha256"
          $requiredFiles = @(
            $installer,
            $manifest,
            $blockmap,
            $defenderReport,
            $inventory,
            $checksums
          )

          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingFiles.Count -gt 0) {
            throw "Release build is missing updater files: $($missingFiles -join ', ')"
          }

          gh release create $env:GITHUB_REF_NAME @requiredFiles `
            --verify-tag `
            --title $version `
            --notes ""

          $publishedAssets = @(
            (gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json).assets.name
          )
          $requiredNames = @($requiredFiles | ForEach-Object { Split-Path -Leaf $_ })
          $missingAssets = @(
            $requiredNames | Where-Object { $_ -notin $publishedAssets }
          )
          if ($missingAssets.Count -gt 0) {
            throw "GitHub release is missing updater assets: $($missingAssets -join ', ')"
          }

          $expectedInstallerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/Recall-Windows-Setup.exe"
          $publishedRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          $publishedInstaller = @(
            $publishedRelease.assets |
              Where-Object { $_.name -eq "Recall-Windows-Setup.exe" }
          )
          if ($publishedInstaller.Count -ne 1 -or $publishedInstaller[0].browser_download_url -ne $expectedInstallerUrl) {
            throw "Published installer does not have the expected immutable URL: $expectedInstallerUrl"
          }
          @(
            "### Microsoft Store package",
            "",
            "Immutable installer URL: $expectedInstallerUrl"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          $matchingReleases = @(
            (gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json) |
              Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          )
          if ($matchingReleases.Count -ne 1) {
            throw "Expected exactly one GitHub release for $env:GITHUB_REF_NAME, found $($matchingReleases.Count)."
          }
